<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Climate Twin</title>
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>🌍 Climate Twin</h1>
    <p class="tagline">Where is your farm going?</p>
  </header>

  <main>
    <p id="status" class="status" role="status" aria-live="polite">
      Click anywhere on the map to choose a field.
    </p>

    <!-- Screen 1: The Reveal (always shown) -->
    <section id="reveal" class="screen">
      <div id="map"></div>
      <div id="map-loading" class="map-loading" hidden>
        <div class="spinner" aria-hidden="true"></div>
        <p>Reading 40 years of NASA climate data…</p>
      </div>
      <div id="result-text" class="overlay">
        <!-- e.g., "Your field in 2045 is Central Thailand today." -->
      </div>
    </section>

    <!-- Buttons that show/hide the optional screens -->
    <nav id="screen-toggles" class="screen-toggles" aria-label="Optional screens">
      <button type="button" class="toggle" data-target="honesty-panel" aria-pressed="false" aria-controls="honesty-panel">
        📊 Compare climates
      </button>
      <button type="button" class="toggle" data-target="drift" aria-pressed="false" aria-controls="drift">
        🧭 See the drift
      </button>
      <button type="button" class="toggle" data-target="viability" aria-pressed="false" aria-controls="viability">
        📉 Crop viability
      </button>
    </nav>

    <!-- Screen 2: The Honesty Panel (optional) -->
    <section id="honesty-panel" class="screen optional" hidden>
      <h2>Climate Signatures</h2>
      <p class="screen-intro">Your field's projected 2045 climate next to its twin's climate today.</p>
      <table id="signature-table">
        <!-- 8 rows: field-2045 vs twin-today -->
      </table>
    </section>

    <!-- Screen 3: The Drift (optional) -->
    <section id="drift" class="screen optional" hidden>
      <h2>Your Field Has Already Moved</h2>
      <div id="drift-map"></div>
      <p id="drift-text"></p>
    </section>

    <!-- Screen 4: Viability Curve (optional) -->
    <section id="viability" class="screen optional" hidden>
      <h2>Current Crop Viability</h2>
      <canvas id="viability-chart"></canvas>
    </section>

    <!-- Caveats — always visible -->
    <aside id="caveats">
      <h3>Important Notes</h3>
      <ul id="caveat-list">
        <!-- populated from contract.caveats -->
      </ul>
    </aside>
  </main>

  <script src="vendor/leaflet/leaflet.js"></script>
  <script src="vendor/chartjs/chart.umd.js"></script>
  <script src="app.js"></script>
</body>
</html>
