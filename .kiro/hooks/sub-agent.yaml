# Hook: Review sub-agent work and run checks
on:
  tool: invoke_sub_agent

run:
  command: |
    echo "🤖 Sub-agent completed. Running verification checks..."
    echo ""
    
    # Find recently modified files (last 2 minutes)
    CHANGED_FILES=$(find . -type f -mmin -2 -not -path "*/.*" -not -path "*/node_modules/*" -not -path "*/venv/*" 2>/dev/null | head -10)
    
    if [ -n "$CHANGED_FILES" ]; then
      echo "📝 Files modified by sub-agent:"
      echo "$CHANGED_FILES"
      echo ""
    fi
    
    # Check if tests exist and should be run
    if [ -f "package.json" ]; then
      echo "Running npm tests..."
      npm test 2>&1 | head -20 || echo "Tests failed - review sub-agent changes"
    elif [ -f "requirements.txt" ] || [ -f "setup.py" ]; then
      echo "Python project detected. Run: pytest"
    elif [ -f "Cargo.toml" ]; then
      echo "Rust project detected. Run: cargo test"
    elif [ -f "go.mod" ]; then
      echo "Go project detected. Run: go test ./..."
    fi
    
    echo ""
    echo "REVIEW CHECKLIST:"
    echo "- Verify sub-agent completed the assigned task"
    echo "- Check for unintended side effects or scope creep"
    echo "- Ensure code quality and style consistency"
    echo "- Confirm tests pass and cover new changes"
    echo "- Validate no breaking changes were introduced"
