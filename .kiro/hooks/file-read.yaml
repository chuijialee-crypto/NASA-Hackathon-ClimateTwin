# Hook: Inject context and track file reads
on:
  tool: read_file

run:
  command: |
    FILE_PATH="$TOOL_OUTPUT_path"
    echo "📖 Read: $FILE_PATH" >> .kiro/read-log.txt
    
    # Check for sensitive file types
    case "$FILE_PATH" in
      *.env|*.env.*|*credentials*|*secret*|*key*|*.pem|*.key)
        echo "⚠️  SENSITIVE FILE: This file may contain secrets. Do not echo sensitive values in responses. Reference by key name only."
        ;;
      *config*|*.yml|*.yaml|*.json|*.toml)
        echo "📋 CONFIG FILE: Pay attention to environment-specific settings and validation rules."
        ;;
      *.sql|*migration*)
        echo "🗄️  DATABASE FILE: Consider data integrity, rollback scenarios, and performance impact."
        ;;
      *)
        echo "✓ File read tracked."
        ;;
    esac
